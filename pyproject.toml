[project]
name = "awp-project-coda"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "fastmcp>=4.2.3",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "mcp>=2.3.0",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "pydantic-ai-slim[groq,mcp]>=2.71.0",
    "scikit-learn>=1.9.1",
    "streamlit>=1.67.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
